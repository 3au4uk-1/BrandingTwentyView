name: CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  # main → prod Twenty; staging → twenty-staging (public URL, not a secret)
  TWENTY_DEPLOY_URL: ${{ github.ref == 'refs/heads/staging' && 'https://twenty-staging.dosugmayak.ru' || vars.TWENTY_DEPLOY_URL }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-install:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve deploy target
        run: |
          echo "Deploying to ${{ env.TWENTY_DEPLOY_URL }} (ref=${{ github.ref_name }})"

      # Staging DB clone already has the same app version installed — use a unique version per run.
      - name: Set unique staging version
        if: github.ref == 'refs/heads/staging'
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = String(pkg.version).replace(/-staging\.\d+$/, '');
          pkg.version = base + '-staging.' + process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('version ->', pkg.version);
          "

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      # Staging clone may already have the app; install can fail on field UUID collisions.
      - name: Install
        continue-on-error: ${{ github.ref == 'refs/heads/staging' }}
        uses: twentyhq/twenty/.github/actions/install-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
