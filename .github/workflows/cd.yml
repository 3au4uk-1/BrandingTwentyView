name: CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  # main → prod Twenty; staging → twenty-staging (public URL, not a secret)
  TWENTY_DEPLOY_URL: ${{ github.ref == 'refs/heads/staging' && 'https://twenty-staging.dosugmayak.ru' || vars.TWENTY_DEPLOY_URL }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-install:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve deploy target
        run: |
          echo "Deploying to ${{ env.TWENTY_DEPLOY_URL }} (ref=${{ github.ref_name }})"

      # Twenty rejects deploy unless package.json version is strictly higher than the
      # currently installed app. Prereleases like 0.5.3-staging.N are LOWER than 0.5.3
      # (semver), so we always rewrite to major.minor.<run_number> for this job only.
      - name: Auto-bump version for deploy
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = String(pkg.version).replace(/[-+].*$/, '');
          const parts = base.split('.').map((n) => parseInt(n, 10) || 0);
          const major = parts[0] ?? 0;
          const minor = parts[1] ?? 0;
          const run = parseInt(process.env.GITHUB_RUN_NUMBER, 10);
          if (!Number.isFinite(run) || run < 1) {
            throw new Error('GITHUB_RUN_NUMBER missing or invalid: ' + process.env.GITHUB_RUN_NUMBER);
          }
          pkg.version = major + '.' + minor + '.' + run;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('version ->', pkg.version, '(from', base + ')');
          "

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      # Staging clone may already have the app; install can fail on field UUID collisions.
      - name: Install
        continue-on-error: ${{ github.ref == 'refs/heads/staging' }}
        uses: twentyhq/twenty/.github/actions/install-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
